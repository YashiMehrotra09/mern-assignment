<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Page </title>
</head>

<body>
    <header>
        <h1>Tech Club Portal</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <h1>Tech Club Membership Form</h1>
    <form action="#" method="post">
        <div>
            <label for="username">Full Name:</label>
            <input type="text" id="username" name="username">
        </div>
        <br>

        <div>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email">
        </div>
        <br>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="passsword" name="password">
        </div>
        <br>
        <div>
            <label for="reg date">Date:</label>
            <input type="date" id="date" name="date">
        </div>
        <br>

        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <br>

        <div>
            <label>Year Level:</label>
            <input type="radio" id="freshman" name="year" value="freshman">
            <label for="freshman">Freshman</label>

            <input type="radio" id="sophomore" name="year" value="sophomore">
            <label for="sophomore">Sophomore</label>

            <input type="radio" id="junior" name="year" value="junior">
            <label for="junior">Junior</label>
        </div>
        <br>
        <div>
            <label for="bio">Why do you want to join?</label><br>
            <textarea id="bio" name="bio" rows="4" cols="30"
                placeholder="Tell us a little about yourself..."></textarea>
        </div>

        <br>
        <div>
            <button type="submit">Register for Tech Club </button>
        </div>

    </form>

</body>

</html>
