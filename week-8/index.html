<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout">

        <!-- top bar -->
        <header class="head">
            <h1>My Dashboard</h1>
        </header>

        <!-- side menu -->
        <aside class="side">
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Messages</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- main area -->
        <main class="main">
            <h2>Overview</h2>
            <div class="boxes">
                <div class="box pink-box">
                    <span class="icon">👥</span>
                    <div class="text">
                        <h3>Users</h3>
                        <p>1,200</p>
                    </div>
                </div>
                <div class="box blue-box">
                    <span class="icon">🛒</span>
                    <div class="text">
                        <h3>Orders</h3>
                        <p>340</p>
                    </div>
                </div>
                <div class="box sand-box">
                    <span class="icon">💰</span>
                    <div class="text">
                        <h3>Sales</h3>
                        <p>₹56,000</p>
                    </div>
                </div>
                <div class="box steel-box">
                    <span class="icon">⭐</span>
                    <div class="text">
                        <h3>Reviews</h3>
                        <p>98</p>
                    </div>
                </div>
                <div class="box pink-box">
                    <span class="icon">📦</span>
                    <div class="text">
                        <h3>Products</h3>
                        <p>75</p>
                    </div>
                </div>
                <div class="box blue-box">
                    <span class="icon">💬</span>
                    <div class="text">
                        <h3>Messages</h3>
                        <p>24</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- footer -->
        <footer class="foot">
            <p>Made with CSS Grid</p>
        </footer>

    </div>

</body>
</html>
