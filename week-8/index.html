<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">

        <!-- top bar -->
        <header class="head">
            <h1>Bloom Bloom</h1>
        </header>

        <!-- side menu -->
        <aside class="side">
            <ul>
                <li>Home</li>
                <li>Orders</li>
                <li>Customers</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- main area -->
        <main class="main">
            <h2>Overview</h2>

            <div class="boxes">
                <div class="box pink-box">
                
                    <div class="text">
                        <h3>Bouquets</h3>
                        <p>420</p>
                    </div>
                </div>

                <div class="box blue-box">
                    
                    <div class="text">
                        <h3>Deliveries</h3>
                        <p>318</p>
                    </div>
                </div>

                <div class="box sand-box">
                    
                    <div class="text">
                        <h3>Sales</h3>
                        <p>₹48,500</p>
                    </div>
                </div>

                <div class="box steel-box">
                    
                    <div class="text">
                        <h3>Reviews</h3>
                        <p>126</p>
                    </div>
                </div>

                <div class="box pink-box">
                    
                    <div class="text">
                        <h3>Subscribers</h3>
                        <p>89</p>
                    </div>
                </div>

                <div class="box blue-box">
                    
                    <div class="text">
                        <h3>Messages</h3>
                        <p>17</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- footer -->
        <footer class="foot">
            <p>Bloom - fresh flowers, delivered</p>
        </footer>

    </div>
</body>
</html>
